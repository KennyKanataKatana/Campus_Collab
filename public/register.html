<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — Campus Collab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" />
    <link href="css/navbar.css" rel="stylesheet" />
    <link href="css/register.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar"></div>
    <main>
      <div class="register-wrapper">
        <div class="brand-mark">
          <span class="brand-name">CAMPUS COLLAB</span>
        </div>

        <h1 class="register-heading">Join the <span class="highlight">crew</span></h1>
        <p class="register-subheading">Make new friends • Join hangouts • Safe space</p>

        <div class="step-dots">
          <div class="step-dot active"></div>
          <div class="step-dot"></div>
          <div class="step-dot"></div>
        </div>

        <form class="register-form" id="signupForm" novalidate>
          <div class="field-group">
            <label class="field-label" for="username">Username</label>
            <input class="field-input" type="text" id="username" placeholder="e.g. hungry_hiro" autocomplete="username" required />
          </div>

          <div class="field-group">
            <label class="field-label" for="email">Student Email</label>
            <input class="field-input" type="email" id="email" placeholder="you@uni.edu.sg" autocomplete="email" required />
          </div>

          <div class="field-group">
            <label class="field-label" for="password">Password</label>
            <input class="field-input" type="password" id="password" placeholder="Make it strong!" autocomplete="new-password" required />
            <div class="strength-bar-wrap" id="strengthWrap">
              <div class="strength-bar" id="strengthBar"></div>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label" for="confirmPassword">Confirm Password</label>
            <input class="field-input" type="password" id="confirmPassword" placeholder="Type it again" autocomplete="new-password" required />
          </div>

          <div class="terms-row">
            <input type="checkbox" id="terms" />
            <label for="terms">
              I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>. Yes, I'm a student.
            </label>
          </div>

          <button type="submit" class="btn-register">Create My Account</button>
        </form>

        <div class="warning-card" id="warningCard">
          <p class="warning-text" id="warningText"></p>
        </div>

        <p class="login-prompt">Already a user? <a href="login.html">Log in here</a></p>
      </div>
    </main>

    <script src="js/queryCmds.js" type="text/javascript"></script>
    <script src="js/getCurrentURL.js" type="text/javascript"></script>
    <script src="js/navbar.js"></script>
    <script src="js/registerUser.js" type="text/javascript"></script>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js" integrity="sha384-fbbOQedDUMZZ5KreZpsbe1LCZPVmfTnH7ois6mU1QK+m14rQ1l2bGBq41eYeM/fS" crossorigin="anonymous"></script>
    <script>
      const pwdInput = document.getElementById('password');
      const strengthWrap = document.getElementById('strengthWrap');
      const strengthBar = document.getElementById('strengthBar');

      pwdInput.addEventListener('input', () => {
        const val = pwdInput.value;
        strengthWrap.classList.toggle('visible', val.length > 0);
        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        const pcts = ['15%', '35%', '65%', '100%'];
        const colors = ['#ff4040', '#ffda3b', '#ffb347', '#00c878'];
        strengthBar.style.width = pcts[score - 1] || '5%';
        strengthBar.style.background = colors[score - 1] || '#ff4040';
      });

      const dots = document.querySelectorAll('.step-dot');
      const allFields = ['username', 'email', 'password', 'confirmPassword'];

      function updateDots() {
        const filled = allFields.filter(id => document.getElementById(id).value.trim()).length;
        dots.forEach((d, i) => {
          d.classList.remove('active', 'done');
          const threshold = [0, 2, 3];
          if (filled > threshold[i]) d.classList.add('done');
          else if (filled === threshold[i]) d.classList.add('active');
        });
      }

      allFields.forEach(id => document.getElementById(id).addEventListener('input', updateDots));

      const form = document.getElementById('signupForm');
      const warningCard = document.getElementById('warningCard');
      const warningText = document.getElementById('warningText');

      function showWarning(msg) {
        warningText.textContent = msg;
        warningCard.classList.add('visible');
      }

      function hideWarning() {
        warningCard.classList.remove('visible');
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        hideWarning();

        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        const termsCheck = document.getElementById('terms').checked;

        if (!username) return showWarning('Pick a username so we know what to call you!');
        if (!email) return showWarning('We need your student email to verify you are on campus.');
        if (password.length < 6) return showWarning('Password must be at least 6 characters.');
        if (password !== confirm) return showWarning('Passwords do not match — try again!');
        if (!termsCheck) return showWarning('Please accept the terms to continue.');

        const btn = form.querySelector('.btn-register');
        btn.textContent = 'Account Created!';
        btn.style.background = '#00c878';
        btn.disabled = true;
      });
    </script>
  </body>
</html>
