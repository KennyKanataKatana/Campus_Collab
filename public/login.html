<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Campus Collab</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link href="css/navbar.css" rel="stylesheet" />
    <link href="css/login.css" rel="stylesheet" />
  </head>
  <body>

  </body>
    <div id="navbar"></div>
    
    <div id="journeyPopup" class="journey-popup">
  <div id="confettiContainer" class="confetti-container"></div>


  <div
    class="journey-popup-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="journeyPopupTitle"
  >
    <span class="journey-popup-icon">🎉</span>

    <p class="journey-popup-brand">Campus Collab</p>

    <h2 id="journeyPopupTitle" class="journey-popup-title">
      Ready to start your Campus Collab journey?
    </h2>

    <p class="journey-popup-description">
      Meet new people, discover campus hangouts, and make great memories together!
    </p>

    <button
      id="closeJourneyPopupButton"
      class="journey-popup-button"
      type="button"
    >
      Yes, I'm in!
    </button>
  </div>
</div>
    <main>
      <div class="login-wrapper">

        <div class="brand-mark">
          <span class="brand-name">Campus Collab</span>
        </div>

        <h1 class="login-heading">Hi there, <span class="highlight">friend</span></h1>
        <p class="login-subheading">Ready to mingle?</p>


        <form id="loginForm" class="login-form">
          <div class="field-group">
            <label class="field-label" for="email">Your Email</label>
            <input
              type="email"
              class="field-input"
              id="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="field-group">
            <div class="password-row">
              <label class="field-label" for="password">Password</label>
              <a href="#" class="forgot-link">Forgot?</a>
            </div>
            <input
              type="password"
              class="field-input"
              id="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <button type="submit" class="btn-login">Let's Go</button>
        </form>

        <div id="warningCard" class="warning-card">
          <p id="warningText" class="warning-text"></p>
        </div>

        <p class="register-prompt">
          New here? <a href="register.html">Join the fun</a>
        </p>

      </div>
    </main>

    <script src="js/queryCmds.js" type="text/javascript"></script>
    <script src="js/getCurrentURL.js" type="text/javascript"></script>
    <script src="js/navbar.js"></script>
    <script src="js/loginUser.js" type="text/javascript"></script>
    <script>
      const warningCard = document.getElementById('warningCard');
      new MutationObserver(() => {
        warningCard.classList.toggle('visible', !warningCard.classList.contains('d-none'));
      }).observe(warningCard, { attributes: true, attributeFilter: ['class'] });
    </script>
  </body>
</html>
